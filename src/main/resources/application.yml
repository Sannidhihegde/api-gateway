server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**
            - id: pricing-service
              uri: lb://pricing-service
              predicates:
                - Path=/pricing/**
            - id: agent-service
              uri: lb://agent-service
              predicates:
                - Path=/agent/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka